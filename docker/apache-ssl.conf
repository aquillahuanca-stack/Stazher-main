<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName _default_
        DocumentRoot /var/www/html

        SSLEngine on
        SSLCertificateFile /etc/ssl/stazher/fullchain.pem
        SSLCertificateKeyFile /etc/ssl/stazher/privkey.pem

        <Directory /var/www/html>
            Options FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/stazher-error.log
        CustomLog ${APACHE_LOG_DIR}/stazher-access.log combined
    </VirtualHost>
</IfModule>

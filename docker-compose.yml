services:
  stazher_app:
    build: .
    container_name: stazher_app
    restart: unless-stopped
    environment:
      STAZHER_DB_HOST: ${STAZHER_DB_HOST}
      STAZHER_DB_NAME: ${STAZHER_DB_NAME}
      STAZHER_DB_USER: ${STAZHER_DB_USER}
      STAZHER_DB_PASSWORD: ${STAZHER_DB_PASSWORD}
      TZ: America/La_Paz
    ports:
      - "8134:443"
    volumes:
      - ./images:/var/www/html/images
      - /home/agbc/SSL2026:/etc/ssl/stazher:ro
    networks:
      default:
        ipv4_address: 10.202.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 10.202.0.0/24
